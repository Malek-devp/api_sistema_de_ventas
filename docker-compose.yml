services: 
  api:
    build: .
    container_name: api_de_sistema_ventas
    ports:
      - "2203:2203"
    volumes:
     - .:/app
     - /app/node_modules
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: malek2003
      DB_DATABASE: api_sistema_de_ventas
    depends_on:
      - postgres
    
  postgres:
    image: postgres:latest
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: api_sistema_de_ventas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: malek2003
    volumes:
      - postgres_data:/var/lib/postgresql
      - C:/Users/HP/Documents/respaldo.sql:/docker-entrypoint-initdb.d/respaldo.sql
    
  pgadmin:
   image: dpage/pgadmin4
   container_name: pgadmin
   ports:
      - "5050:80"
   environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: malek2003
   depends_on:
      - postgres

volumes:
  postgres_data: